<!doctype html>
<html lang="uz">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Apteka — dorilar yetkazib berish{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = { theme: { extend: {
      colors: { ink: '#0B1B3A', cobalt: '#2B50FF', lemon: '#FFE45C', coral: '#FF6B57', sky: '#EAF0FF' },
      fontFamily: { display: ['"Bricolage Grotesque"', 'sans-serif'] } } } }
  </script>
  <style type="text/tailwindcss">
    @layer components {
      .card { @apply rounded-xl border-2 border-ink bg-white shadow-[4px_4px_0_0_#0B1B3A]; }
      .btn { @apply inline-flex items-center justify-center rounded-lg border-2 border-ink px-4 py-2.5 font-semibold transition active:translate-x-[2px] active:translate-y-[2px] active:shadow-none focus-visible:outline focus-visible:outline-4 focus-visible:outline-cobalt/40; }
      .btn-primary { @apply inline-flex items-center justify-center rounded-lg border-2 border-ink bg-cobalt px-4 py-2.5 font-semibold text-white shadow-[3px_3px_0_0_#0B1B3A] transition hover:bg-[#1F3FE0] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none focus-visible:outline focus-visible:outline-4 focus-visible:outline-cobalt/40; }
      .field { @apply w-full rounded-lg border-2 border-ink bg-white px-3 py-2.5 focus:outline-none focus:ring-4 focus:ring-cobalt/25; }
    }
    body { font-family: 'Onest', system-ui, sans-serif; }
  </style>
</head>
<body class="bg-sky text-ink antialiased">
  <header class="border-b-2 border-ink bg-cobalt">
    <div class="mx-auto flex max-w-6xl items-center gap-4 px-4 py-3">
      <a href="{% url 'catalog' %}" class="flex items-center gap-2 font-display text-2xl font-extrabold text-white">
        <span class="grid h-8 w-8 place-items-center rounded-md border-2 border-ink bg-lemon text-ink" aria-hidden="true"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><path d="M9 2h6v7h7v6h-7v7H9v-7H2V9h7z"/></svg></span>
        Apteka
      </a>
      <form method="get" action="{% url 'catalog' %}" class="flex-1">
        <input name="q" value="{{ request.GET.q }}" placeholder="Dori nomini yozing" class="field !py-2">
      </form>
      <a href="{% url 'cart' %}" class="btn bg-lemon shadow-[3px_3px_0_0_#0B1B3A] hover:bg-[#FFD93A]">Savat{% if cart_count %}<span class="ml-2 rounded-md bg-ink px-2 py-0.5 text-xs text-white">{{ cart_count }}</span>{% endif %}</a>
    </div>
  </header>
  <main class="mx-auto max-w-6xl px-4 py-8">{% block content %}{% endblock %}</main>
  <footer class="mx-auto max-w-6xl px-4 pb-10 text-sm text-ink/60">Retsept talab qilinadigan dorilar faqat shifokor retsepti bilan beriladi. Qabul qilishdan oldin shifokor yoki farmatsevt bilan maslahatlashing.</footer>
</body>
</html>
